<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160c06" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset Password | Tribe Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="reset-password.js"></script>
  </head>
  <body class="auth-body">
    <header class="topbar auth-topbar">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>Tribe Quiz</span></a>
      <a class="back-home" href="index.html">← Back to Home</a>
    </header>
    <main class="auth-main">
      <section class="auth-panel" aria-labelledby="reset-title">
        <span class="auth-mark" aria-hidden="true">✦</span>
        <p class="eyebrow eyebrow-gold">Account recovery</p>
        <h1 id="reset-title">Choose a new password</h1>
        <p class="auth-subtitle">Your new password must be at least 8 characters.</p>
        <form id="reset-form" novalidate>
          <div class="auth-field">
            <label class="auth-field-label" for="new-password">New password</label>
            <div class="password-input-wrap">
              <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required />
              <button class="password-toggle" type="button" aria-label="Show new password" aria-controls="new-password" aria-pressed="false" data-password-toggle>Show</button>
            </div>
          </div>
          <div class="auth-field">
            <label class="auth-field-label" for="confirm-new-password">Confirm new password</label>
            <div class="password-input-wrap">
              <input id="confirm-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required />
              <button class="password-toggle" type="button" aria-label="Show confirm new password" aria-controls="confirm-new-password" aria-pressed="false" data-password-toggle>Show</button>
            </div>
          </div>
          <p class="auth-error" id="reset-message" role="status" aria-live="polite"></p>
          <button class="button button-primary auth-submit" type="submit" id="reset-submit">Reset password <span>›</span></button>
        </form>
        <p class="auth-switch"><a class="auth-back-link" href="auth.html?tab=signin">Back to sign in</a></p>
      </section>
    </main>
  </body>
</html>
