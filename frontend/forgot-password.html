<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160c06" />
    <title>Forgot Password | Tribe Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="forgot-password.js"></script>
  </head>
  <body class="auth-body">
    <header class="topbar auth-topbar">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>Tribe Quiz</span></a>
      <a class="back-home" href="index.html">← Back to Home</a>
    </header>
    <main class="auth-main">
      <section class="auth-panel" aria-labelledby="forgot-title">
        <span class="auth-mark" aria-hidden="true">✦</span>
        <p class="eyebrow eyebrow-gold">Account recovery</p>
        <h1 id="forgot-title">Forgot password?</h1>
        <p class="auth-subtitle">Enter your account email. If a reset link doesn’t arrive, check your spam folder or contact the site administrator.</p>
        <form id="forgot-form" novalidate>
          <label class="auth-field">
            <span>Email</span>
            <input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <p class="auth-error" id="forgot-message" role="status" aria-live="polite"></p>
          <button class="button button-primary auth-submit" type="submit" id="forgot-submit">Send reset link <span>›</span></button>
        </form>
        <p class="auth-switch"><a class="auth-back-link" href="auth.html?tab=signin">Back to sign in</a></p>
      </section>
    </main>
  </body>
</html>
